payloadProcessor:
  name: payload-processor
  replicas: 1
  image:
    registry: ghcr.io/llm-d
    repository: llm-d-inference-payload-processor
    tag: v0.1.0
    pullPolicy: IfNotPresent
  port: 9004
  healthCheckPort: 9005
  multiNamespace: false

  flags:
    # Log verbosity
    v: 3

  # Additional environment variables for the payload processor container.
  # Example:
  # env:
  #   - name: GATEWAY_NAME
  #     value: "my-gateway"
  env: []

  customConfig: {}

  # Example defining a custom IPP configuration
  # customConfig:
  #   plugins:
  #   - type: body-field-to-header
  #     parameters:
  #       fieldName: model
  #       headerName: X-Gateway-Model-Name
  #   profiles:
  #   - name: default
  #     plugins:
  #       request:
  #       - pluginRef: body-field-to-header

  # models.json content, rendered into /config/models.json inside the pod. Consumed by the
  # `model-config-datasource` plugin; set `modelsPath: /config/models.json` in customConfig
  # when you use it. Left empty nothing is rendered, and that plugin fails to start because
  # modelsPath does not exist -- so only set this when customConfig configures the plugin.
  #
  # Schema mirrors the plugin's config file format (see its README):
  #   models[]                   each entry needs a non-empty `name`.
  #     name                     required.
  #     pricing.inputPerMillion  optional; USD per 1M input tokens; defaults to 0.
  #     pricing.outputPerMillion optional; USD per 1M output tokens; defaults to 0.
  #   groups[]                   optional; each entry needs a non-empty `name` + `models`.
  #     name                     required.
  #     models                   required; model names, which must appear in `models[]`.
  #
  # Example:
  #   models:
  #     models:
  #       - name: facebook/opt-125m
  #         pricing:
  #           inputPerMillion: 0.5
  #           outputPerMillion: 1.5
  #       - name: facebook/opt-350m
  #     groups:
  #       - name: fast
  #         models: [facebook/opt-125m, facebook/opt-350m]
  models: {}

  tracing:
    enabled: false
    otelServiceName: "inference.llm-d.ai/inference-payload-processor"
    otelExporterEndpoint: "http://localhost:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.1"

provider:
  name: none

  # ext_proc events configuration.
  # Controls which HTTP lifecycle events are sent to the payload processor.
  # Enable only the events that plugins actually need to process.
  supportedEvents:
    requestHeaders: true
    requestBody: true
    requestTrailers: true
    responseHeaders: true
    responseBody: true
    responseTrailers: true

  # Istio-specific configuration.
  # This block is only used if name is "istio".
  istio:
    envoyFilter:
      # Operation for inserting the ext_proc filter into the Envoy filter chain.
      operation: INSERT_FIRST
      # Anchor filter for INSERT_BEFORE/INSERT_AFTER (empty = no anchor).
      anchorSubFilter: ""

inferenceGateway:
  name: inference-gateway
