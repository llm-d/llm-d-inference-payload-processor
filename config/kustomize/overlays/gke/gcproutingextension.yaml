apiVersion: networking.gke.io/v1
kind: GCPRoutingExtension
metadata:
  # Namespace is set by kustomization.yaml
  name: payload-processor
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      # Update to match your Gateway name.
      name: inference-gateway
  extensionChains:
    - name: chain1
      extensions:
        - name: ext1
          authority: "myext.com"
          # IPP processes full request/response bodies (FullDuplexStreamed
          # below) plus model-selection and cost-computation logic, so a
          # 1s timeout is too aggressive under load or with larger payloads.
          # 10s is a safer starting point; tune based on observed p99
          # request latency and payload size.
          timeout: 10s
          supportedEvents:
            - RequestHeaders
            - RequestBody
            - RequestTrailers
            - ResponseHeaders
            - ResponseBody
            - ResponseTrailers
          requestBodySendMode: "FullDuplexStreamed"
          responseBodySendMode: "FullDuplexStreamed"
          backendRef:
            group: ""
            kind: Service
            name: payload-processor
            port: 9004
