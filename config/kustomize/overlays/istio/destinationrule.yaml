apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  # Namespace is set by kustomization.yaml
  name: payload-processor
spec:
  # The namespace segment below is a placeholder; it is replaced at build
  # time by the `replacements` block in kustomization.yaml to match the
  # overlay's `namespace:`.
  host: payload-processor.default.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      # IPP serves TLS with a self-signed certificate generated at startup
      # (see internal/tls/tls.go) rather than one issued by a shared/trusted
      # CA, so Istio cannot validate it against a CA bundle. This setting
      # is intentional for intra-cluster traffic to the sidecar; do not set
      # this on a DestinationRule that targets an externally-facing host.
      insecureSkipVerify: true
