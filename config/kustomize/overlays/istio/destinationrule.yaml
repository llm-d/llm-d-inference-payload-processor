apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  # Namespace is set by kustomization.yaml
  name: payload-processor
spec:
  # The namespace segment below is a placeholder; it is replaced at build
  # time by the `replacements` block in kustomization.yaml to match the
  # overlay's `namespace:`.
  host: payload-processor.default.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
