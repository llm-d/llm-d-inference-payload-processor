apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  # Namespace is set by kustomization.yaml
  name: payload-processor
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      # Update to match your Gateway name.
      name: inference-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_FIRST
        value:
          name: envoy.filters.http.ext_proc.payload-processor
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: false
            allow_mode_override: true
            processing_mode:
              request_header_mode: "SEND"
              response_header_mode: "SEND"
              request_body_mode: "FULL_DUPLEX_STREAMED"
              response_body_mode: "FULL_DUPLEX_STREAMED"
              request_trailer_mode: "SEND"
              response_trailer_mode: "SEND"
            grpc_service:
              envoy_grpc:
                # The namespace segment below is a placeholder; it is
                # replaced at build time by the `replacements` block in
                # kustomization.yaml to match the overlay's `namespace:`.
                cluster_name: outbound|9004||payload-processor.default.svc.cluster.local
