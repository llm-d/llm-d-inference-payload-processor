apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Override the namespace for all resources in the base.
# The namespace segment embedded in the EnvoyFilter cluster_name and the
# DestinationRule host (below, via `replacements`) is derived from this
# field automatically, so it never drifts out of sync.
namespace: default

resources:
  - ../../base
  - envoyfilter.yaml
  - destinationrule.yaml

# Inject the overlay namespace into the FQDN segments of the EnvoyFilter's
# cluster_name and the DestinationRule's host, so changing `namespace:`
# above is the single source of truth and can't silently drift.
replacements:
  - source:
      kind: Service
      name: payload-processor
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: EnvoyFilter
          name: payload-processor
        fieldPaths:
          - spec.configPatches.0.patch.value.typed_config.grpc_service.envoy_grpc.cluster_name
        options:
          delimiter: "."
          index: 1
      - select:
          kind: DestinationRule
          name: payload-processor
        fieldPaths:
          - spec.host
        options:
          delimiter: "."
          index: 1
