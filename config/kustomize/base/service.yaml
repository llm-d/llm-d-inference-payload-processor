apiVersion: v1
kind: Service
metadata:
  name: payload-processor
spec:
  selector:
    app: payload-processor
  ports:
    # Named so Istio (and other mesh sidecars) detect the protocol from the
    # port name instead of treating the traffic as opaque TCP.
    - name: grpc-ext-proc
      protocol: TCP
      port: 9004
      targetPort: 9004
      appProtocol: HTTP2
  type: ClusterIP
