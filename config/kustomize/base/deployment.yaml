apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payload-processor
  template:
    metadata:
      labels:
        app: payload-processor
    spec:
      serviceAccountName: payload-processor
      containers:
        - name: payload-processor
          image: ghcr.io/llm-d/llm-d-inference-payload-processor:main
          imagePullPolicy: IfNotPresent
          args:
            - --config-file
            - /config/default-ipp-config.yaml
            - --v=3
            - --tracing=false
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: grpc
              containerPort: 9004
            - name: grpc-health
              containerPort: 9005
          # Conservative starting point for a request/response processing
          # sidecar; tune based on observed load (payload size, RPS) before
          # running in production.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          # Port 9005 serves the standard gRPC health protocol
          # (grpc.health.v1), see cmd/runner/health.go.
          readinessProbe:
            grpc:
              port: 9005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 9005
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          configMap:
            name: payload-processor
