payloadProcessor:
  listModels:
    - facebook/opt-125m
    - facebook/opt-350m
  customConfig:
    plugins:
    - type: body-field-to-header
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: base-model-to-header
    - type: model-selector
    - type: queue-ttft-scorer
      # effectiveTTFT = P10Low + inflight x (P50 - P10Low) / inflightAtP50
      # line through (0, P10Low) and (inflightAtP50, P50), extrapolated linearly
    - type: max-score-picker
    - type: ttft-percentile-extractor
      parameters:
        intervalDuration: 1s
        windowSize: 5000             # ~200 KB per model; holds ~1h at 1 req/s or ~8 min at 10 req/s
        windowAge: 1m                # window for P50 and P10 (short = fresh, responsive)
        minObservations: 3
        inflightEmaAlpha: 0.2        # EMA of inflight count (observability only)
        lowLoadWindowAge: 1h         # window for two-level P10Low (long = stable hardware floor)
    - type: model-config-datasource
      parameters:
        modelsPath: /config/models.json
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-selector
        - pluginRef: median-ttft-scorer
          weight: 1.0
        - pluginRef: max-score-picker
        - pluginRef: body-field-to-header
        - pluginRef: base-model-to-header
    datalayer:
      extractors:
      - pluginRef: ttft-percentile-extractor
      datasources:
      - pluginRef: model-config-datasource
